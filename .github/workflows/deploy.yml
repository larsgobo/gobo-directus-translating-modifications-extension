name: Build extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-extension
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
          npm run validate

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: |
            dist/
            package.json
          retention-days: 14

      - name: Deploy note
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "::notice::Build succeeded. GitHub-hosted runners cannot SSH to your VPS (port 22 timeout)."
          echo "::notice::Deploy using scripts/vps-update-extension.sh on the server, or install a self-hosted runner (see docs/DEPLOYMENT.md)."
