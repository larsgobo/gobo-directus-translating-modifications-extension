# CI only: validate build on pull requests (does NOT deploy to VPS).

name: CI build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
          npm run validate
