# Deploy via SSH to Easypanel VPS.
# Uses the same secret names as larsgobo/custom-directus-gobo when possible.
# Run manually: Actions → Deploy extension (SSH) → Run workflow

name: Deploy extension (SSH)

on:
  workflow_dispatch:

env:
  EASYPANEL_PROJECT: gobo-dk-gtm
  EASYPANEL_SERVICE: directus
  EXTENSION_FOLDER: gobo-translation-modifications

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
          npm run validate

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: |
            dist/
            package.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-dist
          path: deploy-bundle

      - name: Resolve SSH target and deploy path
        id: cfg
        env:
          DEPLOY_EXTENSIONS_PATH: ${{ secrets.DEPLOY_EXTENSIONS_PATH }}
          DOCKER_VOLUME_NAME: ${{ secrets.DOCKER_VOLUME_NAME }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail

          HOST="${VPS_HOST:-$DEPLOY_HOST}"
          USER="${VPS_USER:-$DEPLOY_USER}"
          PORT="${VPS_PORT:-${DEPLOY_SSH_PORT:-22}}"

          if [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "Set VPS_HOST + VPS_USER (or DEPLOY_HOST + DEPLOY_USER) in repository secrets." >&2
            exit 1
          fi

          if [ -n "$DEPLOY_EXTENSIONS_PATH" ]; then
            TARGET="$DEPLOY_EXTENSIONS_PATH"
          elif [ -n "$DOCKER_VOLUME_NAME" ]; then
            if [[ "$DOCKER_VOLUME_NAME" == /* ]]; then
              TARGET="${DOCKER_VOLUME_NAME%/}/${EXTENSION_FOLDER}"
            else
              TARGET="/etc/easypanel/projects/${EASYPANEL_PROJECT}/${EASYPANEL_SERVICE}/volumes/${DOCKER_VOLUME_NAME}/${EXTENSION_FOLDER}"
            fi
          else
            echo "Set DEPLOY_EXTENSIONS_PATH or DOCKER_VOLUME_NAME (e.g. extensions) in secrets." >&2
            exit 1
          fi

          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "user=$USER" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Deploying to ${USER}@${HOST}:${PORT} → ${TARGET}"

      - name: Copy extension to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.cfg.outputs.host }}
          username: ${{ steps.cfg.outputs.user }}
          key: ${{ secrets.VPS_SSH_KEY != '' && secrets.VPS_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.cfg.outputs.port }}
          timeout: 120s
          source: deploy-bundle/package.json,deploy-bundle/dist
          target: ${{ steps.cfg.outputs.target }}
          strip_components: 1
          overwrite: true

      - name: Trigger Easypanel redeploy (optional)
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        if: env.WEBHOOK != ''
        run: curl -fsS -X POST "$WEBHOOK"
